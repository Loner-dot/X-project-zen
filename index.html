<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEN AI | Session Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #020202;
            --accent: #6C5CE7;
            --accent2: #A8E6CF;
            --text-dim: #555;
            --glow: rgba(108, 92, 231, 0.3);
            --neon: #00ff88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(108, 92, 231, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 136, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(108, 92, 231, 0.03) 0%, transparent 50%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Animated Grid Background */
        .grid-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(108, 92, 231, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108, 92, 231, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            animation: floatUp 6s infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Orbiting Rings */
        .orbit {
            position: absolute;
            border: 1px solid rgba(108, 92, 231, 0.1);
            border-radius: 50%;
            animation: rotate 30s linear infinite;
            z-index: 0;
        }

        .orbit-1 {
            width: 500px;
            height: 500px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit-2 {
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            animation-direction: reverse;
            animation-duration: 40s;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Main Card */
        .card {
            background: rgba(2, 2, 2, 0.9);
            border: 1px solid rgba(108, 92, 231, 0.2);
            padding: 50px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 0 40px rgba(108, 92, 231, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 0 60px rgba(108, 92, 231, 0.2),
                0 30px 80px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-color: rgba(108, 92, 231, 0.4);
        }

        /* Glow Effect Behind Card */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                var(--accent), 
                transparent, 
                var(--neon), 
                transparent, 
                var(--accent));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.3;
            animation: borderGlow 3s linear infinite;
            background-size: 400% 400%;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Logo */
        .logo-area {
            margin-bottom: 35px;
        }

        .logo-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-area h2 {
            font-size: 28px;
            letter-spacing: 12px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(108, 92, 231, 0.5);
        }

        .sub-tag {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 600;
        }

        /* Input */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group::before {
            content: '+';
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-weight: 700;
            font-size: 18px;
            z-index: 2;
        }

        input {
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(108, 92, 231, 0.2);
            padding: 18px 20px 18px 45px;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            text-align: left;
            outline: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 1px;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 
                0 0 20px rgba(108, 92, 231, 0.3),
                inset 0 0 20px rgba(108, 92, 231, 0.05);
            background: rgba(15, 15, 15, 0.9);
        }

        input::placeholder {
            color: #333;
            letter-spacing: 2px;
        }

        /* Button */
        button {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
            letter-spacing: 5px;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:active {
            transform: translateY(-1px);
            transition: all 0.1s;
        }

        button:disabled {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            color: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            letter-spacing: 3px;
        }

        button:disabled::before {
            display: none;
        }

        /* Code Display */
        #code-display {
            margin-top: 40px;
            min-height: 60px;
            position: relative;
        }

        .code-box {
            font-family: 'Courier New', monospace;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #fff;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s;
            text-shadow: 0 0 20px rgba(108, 92, 231, 0.5);
            animation: codeAppear 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes codeAppear {
            0% { 
                opacity: 0; 
                transform: scale(0.8); 
                filter: blur(10px);
            }
            100% { 
                opacity: 1; 
                transform: scale(1); 
                filter: blur(0);
            }
        }

        .code-box:hover {
            text-shadow: 
                0 0 10px #fff,
                0 0 20px var(--accent),
                0 0 40px var(--accent);
            transform: scale(1.05);
        }

        .status-msg {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 20px;
            height: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .status-msg.success {
            color: var(--neon);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .status-msg.error {
            color: #ff4444;
        }

        .status-msg.loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
                margin: 20px;
            }
            
            .logo-area h2 {
                font-size: 22px;
                letter-spacing: 8px;
            }
            
            .code-box {
                font-size: 26px;
                letter-spacing: 5px;
            }
        }

        /* Hide scrollbar */
        body::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="grid-bg"></div>
    <div class="orbit orbit-1"></div>
    <div class="orbit orbit-2"></div>
    
    <!-- Particles Container -->
    <div class="particles" id="particles"></div>
    
    <!-- Main Card -->
    <div class="card">
        <div class="logo-area">
            <span class="logo-icon">🔮</span>
            <h2>ZEN AI</h2>
            <div class="sub-tag">Session Generator</div>
        </div>

        <div class="input-group">
            <input type="text" id="phone" placeholder="Enter Number (e.g. 234...)" autocomplete="off">
        </div>

        <button id="gen-btn" onclick="requestPairing()">
            <i class="fas fa-bolt"></i> &nbsp;Generate Pairing Code
        </button>

        <div id="code-display">
            <div id="pairing-code" class="code-box"></div>
            <div id="status" class="status-msg"></div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // Main pairing function
        async function requestPairing() {
            const phoneInput = document.getElementById('phone');
            const btn = document.getElementById('gen-btn');
            const codeBox = document.getElementById('pairing-code');
            const status = document.getElementById('status');
            
            const phone = phoneInput.value.replace(/\D/g, '');
            
            if (!phone || phone.length < 10) {
                status.innerText = '⚠ Invalid Number';
                status.className = 'status-msg error';
                phoneInput.style.borderColor = '#ff4444';
                phoneInput.style.boxShadow = '0 0 20px rgba(255, 68, 68, 0.3)';
                setTimeout(() => {
                    phoneInput.style.borderColor = 'rgba(108, 92, 231, 0.2)';
                    phoneInput.style.boxShadow = 'none';
                }, 2000);
                return;
            }

            // UI Loading State
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> &nbsp;Connecting...';
            codeBox.innerText = '';
            status.innerText = 'Initializing Connection';
            status.className = 'status-msg loading';

            try {
                const response = await fetch(`/pair?phone=${phone}&v=${Date.now()}`);
                const data = await response.json();

                if (data.code) {
                    status.innerText = '✅ Click Code to Copy';
                    status.className = 'status-msg success';
                    codeBox.innerText = data.code;
                    codeBox.style.cursor = 'pointer';
                    
                    // Copy to clipboard on click
                    codeBox.onclick = async () => {
                        try {
                            await navigator.clipboard.writeText(data.code);
                            status.innerText = '📋 Copied Successfully!';
                            status.className = 'status-msg success';
                            
                            // Flash effect
                            codeBox.style.textShadow = '0 0 30px var(--neon), 0 0 60px var(--neon)';
                            setTimeout(() => {
                                codeBox.style.textShadow = '0 0 20px rgba(108, 92, 231, 0.5)';
                            }, 300);
                            
                            setTimeout(() => {
                                status.innerText = '✅ Click Code to Copy';
                            }, 2000);
                        } catch (err) {
                            status.innerText = '❌ Copy Failed - Select Manually';
                            status.className = 'status-msg error';
                        }
                    };
                    
                    // Reset button
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-bolt"></i> &nbsp;Generate New Code';
                    
                } else {
                    status.innerText = '❌ ' + (data.error || 'Connection Failed');
                    status.className = 'status-msg error';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-redo"></i> &nbsp;Try Again';
                }
            } catch (err) {
                status.innerText = '🌐 Server Unreachable';
                status.className = 'status-msg error';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-redo"></i> &nbsp;Retry Connection';
            }
        }

        // Enter key to submit
        document.getElementById('phone').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') requestPairing();
        });
    </script>
</body>
</html>
